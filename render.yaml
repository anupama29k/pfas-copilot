# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: pfas-copilot
    runtime: python
    plan: starter            # a persistent disk needs a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PFAS_DB
        value: /data/pfas.db
      - key: PFAS_USER
        value: pfas
      - key: PFAS_PASSWORD
        sync: false          # set it in the Render dashboard; never commit it
    disk:
      name: pfas-data
      mountPath: /data
      sizeGB: 1
